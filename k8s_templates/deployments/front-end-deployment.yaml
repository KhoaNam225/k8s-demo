apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-frontend
  namespace: k8s-demo
  labels:
    app: k8s-demo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-demo-frontend
  template:
    metadata:
      labels:
        app: k8s-demo-frontend
    spec:
      containers:
        - name: k8s-demo-frontend
          image: acrregistry7629.azurecr.io/front-end:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "0.5"
              memory: "512Mi"
            requests:
              cpu: "0.2"
              memory: "256Mi"
